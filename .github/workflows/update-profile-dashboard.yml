name: Update profile dashboard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-profile-dashboard.yml"
      - "scripts/generate-profile-dashboard.mjs"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate dashboard assets
        run: node scripts/generate-profile-dashboard.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: nao317

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/development-dashboard*.svg
          git diff --cached --quiet || git commit -m "chore: update profile dashboard [skip ci]"
          git push
